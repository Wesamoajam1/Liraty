<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Liraty - تطبيق ذكي لتحويل العملات وأسعار الصرف في سوريا">
  <title>Liraty | ليرتي</title>

  <style>
    :root {
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-2: #f9fafb;
      --surface-3: #f1f4f5;
      --text: #202124;
      --muted: #777d82;
      --border: #e1e5e7;
      --green: #159447;
      --green-2: #0f7d3b;
      --green-soft: #e9f7ef;
      --purple: #9146c7;
      --purple-soft: #f5ebfb;
      --red: #e33a4b;
      --gold: #d39b17;
      --shadow: 0 8px 28px rgba(25, 38, 45, .07);
      --radius: 15px;
    }

    body.dark {
      --bg: #071217;
      --surface: #0b171d;
      --surface-2: #0e1c23;
      --surface-3: #12232b;
      --text: #f4f7f8;
      --muted: #a7b0b5;
      --border: #263840;
      --green: #16b65b;
      --green-2: #0f9148;
      --green-soft: rgba(22,182,91,.12);
      --purple: #bd5ee8;
      --purple-soft: rgba(189,94,232,.12);
      --red: #f04457;
      --gold: #e0aa25;
      --shadow: 0 10px 30px rgba(0,0,0,.20);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Tajawal", "Cairo", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .25s ease, color .25s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    #app {
      width: min(1420px, 100%);
      margin: 0 auto;
      padding: 14px 14px 110px;
    }

    /* =====================
       التخطيط الرئيسي
       ===================== */

    .top-dashboard {
      display: grid;
      grid-template-columns: 1fr minmax(440px, 2.7fr) 1fr;
      grid-template-areas:
        "left center right";
      gap: 12px;
      align-items: start;
    }

    .left-panel {
      grid-area: left;
    }

    .center-panel {
      grid-area: center;
      min-width: 0;
    }

    .right-panel {
      grid-area: right;
    }

    .panel,
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 12px;
    }

    .card {
      padding: 13px;
    }

    /* =====================
       الهوية
       ===================== */

    .brand-header {
      position: relative;
      padding: 2px 0 8px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .brand-name {
      line-height: 1;
      text-align: right;
    }

    .brand-ar {
      font-size: clamp(34px, 4vw, 58px);
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--green);
    }

    .brand-en {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      direction: ltr;
    }

    .flag {
      position: relative;
      width: 105px;
      height: 70px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,.14);
      border: 1px solid rgba(0,0,0,.08);
    }

    .flag svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .brand-subtitle {
      text-align: center;
      margin-top: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.7;
    }

    .header-tools {
      position: absolute;
      top: 0;
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .header-tools.start {
      right: 0;
    }

    .header-tools.end {
      left: 0;
    }

    .tool-chip {
      min-height: 39px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 10px;
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    /* =====================
       عناوين الأقسام
       ===================== */

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-title h2 {
      font-size: 19px;
      font-weight: 800;
    }

    .section-title h2.purple {
      color: var(--purple);
    }

    .section-title h2.green {
      color: var(--green);
    }

    .show-all {
      color: var(--green);
      border: 0;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
    }

    /* =====================
       المحول الرئيسي
       ===================== */

    .converter-card {
      margin-top: 8px;
    }

    .converter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .converter-head h2 {
      color: var(--purple);
      font-size: 18px;
    }

    .update-text {
      font-size: 10px;
      color: var(--muted);
    }

    .update-text::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      margin-left: 5px;
    }

    .converter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: relative;
    }

    .amount-box,
    .currency-box {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 13px;
      min-height: 116px;
      padding: 12px;
    }

    .amount-box label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .amount-input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 27px;
      direction: ltr;
      text-align: right;
      padding: 0;
    }

    .amount-caption {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .currency-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .currency-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .currency-flag {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 23px;
      flex: 0 0 auto;
      background: var(--surface-3);
      border: 1px solid var(--border);
    }

    .currency-label small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .currency-label strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
      direction: ltr;
      text-align: right;
    }

    .chevron {
      color: var(--muted);
      font-size: 22px;
    }

    .swap-main {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      z-index: 2;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--purple);
      background: var(--surface);
      color: var(--green);
      font-size: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .converter-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
    }

    .stat {
      padding: 10px 12px;
      min-height: 67px;
    }

    .stat + .stat {
      border-right: 1px solid var(--border);
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 5px;
    }

    .stat strong {
      color: var(--green);
      font-size: 18px;
      direction: ltr;
      display: block;
    }

    .mini-chart {
      height: 33px;
      width: 100%;
      display: block;
    }

    .rate-note {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      margin-top: 9px;
    }

    /* =====================
       العملات
       ===================== */

    .rates-card {
      margin-top: 10px;
    }

    .currency-cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 7px;
    }

    .rate-card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      padding: 9px 6px;
      text-align: center;
    }

    .rate-card .currency-flag {
      margin: 0 auto 5px;
      width: 38px;
      height: 38px;
    }

    .rate-card .code {
      font-weight: 900;
      font-size: 12px;
      direction: ltr;
    }

    .rate-card .name {
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rate-card .price {
      color: var(--green);
      font-size: 14px;
      font-weight: 900;
      direction: ltr;
      margin-top: 5px;
    }

    .rate-card.down .price {
      color: var(--red);
    }

    .rate-card .change {
      color: var(--green);
      font-size: 9px;
      direction: ltr;
    }

    .rate-card.down .change {
      color: var(--red);
    }

    /* =====================
       الذهب والفضة
       ===================== */

    .metals-card {
      margin-top: 10px;
    }

    .metal-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 7px;
    }

    .metal-card {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 8px;
    }

    .metal-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .metal-icon {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(210,155,23,.12);
      font-size: 20px;
    }

    .metal-name {
      font-size: 10px;
      color: var(--muted);
    }

    .metal-name strong {
      display: block;
      color: var(--gold);
      font-size: 11px;
    }

    .metal-price {
      color: var(--green);
      font-size: 14px;
      font-weight: 900;
      margin-top: 5px;
      direction: ltr;
      text-align: right;
    }

    /* =====================
       اللوحات الجانبية
       ===================== */

    .side-card + .side-card {
      margin-top: 10px;
    }

    .side-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--purple);
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 9px;
    }

    .side-title .icon {
      font-size: 20px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--surface-3);
      border-radius: 9px;
      padding: 3px;
      margin-bottom: 8px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 7px;
      padding: 7px 5px;
      font-size: 10px;
      font-weight: 800;
    }

    .tab.active {
      background: var(--green);
      color: #fff;
    }

    .notice-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 7px;
      align-items: center;
      padding: 8px 3px;
      border-bottom: 1px solid var(--border);
    }

    .notice-row:last-of-type {
      border-bottom: 0;
    }

    .notice-text {
      min-width: 0;
    }

    .notice-text strong {
      display: block;
      font-size: 10px;
    }

    .notice-text span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-top: 2px;
      direction: ltr;
      text-align: right;
    }

    .bell {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--green);
      display: grid;
      place-items: center;
      font-size: 15px;
    }

    .outline-btn {
      width: 100%;
      border: 1px solid var(--purple);
      color: var(--purple);
      background: transparent;
      border-radius: 9px;
      padding: 8px;
      font-size: 11px;
      font-weight: 900;
      margin-top: 7px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      padding: 7px 9px;
      margin-bottom: 5px;
    }

    .search-box span {
      color: var(--muted);
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 10px;
    }

    .market-row {
      display: grid;
      grid-template-columns: auto 1fr auto 50px;
      gap: 6px;
      align-items: center;
      padding: 5px 2px;
      border-bottom: 1px solid var(--border);
    }

    .market-row:last-child {
      border-bottom: 0;
    }

    .market-code {
      font-size: 9px;
      font-weight: 900;
      direction: ltr;
    }

    .market-name {
      font-size: 8px;
      color: var(--muted);
      white-space: nowrap;
    }

    .market-price {
      font-size: 9px;
      font-weight: 900;
      direction: ltr;
    }

    .market-change {
      font-size: 8px;
      direction: ltr;
    }

    .up {
      color: var(--green);
    }

    .down {
      color: var(--red);
    }

    .spark {
      width: 50px;
      height: 19px;
    }

    /* =====================
       لماذا ليرتي
       ===================== */

    .why-card {
      height: 100%;
    }

    .why-title {
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 9px;
    }

    .feature {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 11px;
      padding: 10px;
      margin-bottom: 7px;
    }

    .feature-head {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-weight: 900;
      font-size: 12px;
    }

    .feature-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--purple-soft);
      color: var(--purple);
      font-size: 17px;
      flex: 0 0 auto;
    }

    .feature p {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.7;
      margin-top: 5px;
    }

    .city-art {
      height: 130px;
      margin: 12px -2px -3px;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: linear-gradient(
        to top,
        rgba(145,70,199,.13),
        transparent
      );
    }

    .city-art::before {
      content: "☪  ▰  ✦  ▰  ☪";
      position: absolute;
      bottom: 17px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: var(--purple);
      font-size: 42px;
      letter-spacing: 7px;
      opacity: .65;
    }

    .city-art::after {
      content: "▰ ▰ ▰ ▰ ▰ ▰ ▰ ▰";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: var(--green);
      font-size: 22px;
      opacity: .8;
    }

    /* =====================
       الصف السفلي
       ===================== */

    .lower-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .lower-card {
      min-width: 0;
    }

    .history-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 7px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .history-item:last-of-type {
      border-bottom: 0;
    }

    .delete-icon {
      color: var(--red);
      font-size: 15px;
    }

    .history-main strong {
      display: block;
      font-size: 10px;
    }

    .history-main span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-top: 2px;
    }

    .history-value {
      font-size: 9px;
      direction: ltr;
      text-align: left;
    }

    .history-actions {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
    }

    .mini-tab {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 9px;
    }

    .mini-tab.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .clear-history {
      width: 100%;
      border: 1px solid var(--red);
      color: var(--red);
      background: transparent;
      border-radius: 9px;
      padding: 8px;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 900;
    }

    .muted-note {
      color: var(--muted);
      font-size: 9px;
      text-align: center;
      margin-top: 5px;
    }

    .mini-converter {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      position: relative;
    }

    .mini-input {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 10px;
      padding: 8px;
    }

    .mini-input small {
      display: block;
      color: var(--muted);
      font-size: 9px;
    }

    .mini-input input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 17px;
      direction: ltr;
      text-align: right;
    }

    .mini-swap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--green);
      background: var(--surface);
      color: var(--green);
      z-index: 2;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
      margin-top: 8px;
    }

    .key {
      border: 1px solid var(--border);
      background: var(--surface-3);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 12px;
    }

    .key.purple {
      background: var(--purple);
      color: #fff;
      border-color: var(--purple);
    }

    .fav-title {
      color: var(--muted);
      font-size: 10px;
      margin-top: 8px;
      margin-bottom: 5px;
    }

    .favorites {
      display: grid;
      grid-template-columns: repeat(5,1fr);
      gap: 4px;
    }

    .favorite {
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 2px;
      background: var(--surface-2);
    }

    .favorite .currency-flag {
      width: 28px;
      height: 28px;
      margin: auto;
      font-size: 16px;
    }

    .favorite b {
      display: block;
      font-size: 8px;
      direction: ltr;
    }

    .favorite span {
      color: var(--green);
      display: block;
      font-size: 8px;
      direction: ltr;
    }

    /* =====================
       شريط التنقل
       ===================== */

    .bottom-nav {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: min(1050px, calc(100% - 24px));
      display: grid;
      grid-template-columns: repeat(5,1fr);
      align-items: center;
      padding: 5px 8px;
      background: color-mix(
        in srgb,
        var(
