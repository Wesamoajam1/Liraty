<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#ffffff">

  <title>Liraty | ليرتي</title>

  <meta name="description"
        content="ليرتي - محول العملات السورية وأسعار الصرف بطريقة بسيطة وسريعة">

  <style>

    /* ========================================
       LIRATY
       التصميم الأساسي
       ======================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

      background: #f6f7f9;
      color: #202124;

      min-height: 100vh;

      direction: rtl;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ========================================
       التطبيق
       ======================================== */

    #app {
      width: 100%;
      min-height: 100vh;

      padding-bottom: 90px;
    }
/* ==============================
   هوية LIRATY
   ============================== */

.app-header {
  padding: 22px 18px 16px;
  text-align: center;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.brand-name {
  text-align: right;
  line-height: 1.05;
}

.brand-ar {
  font-size: 28px;
  font-weight: 800;
  color: #202124;
}

.brand-en {
  margin-top: 5px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #777;
  direction: ltr;
}

.header-subtitle {
  margin-top: 12px;
  font-size: 14px;
  font-weight: 600;
  color: #666;
}

/* علم سوريا */
.syrian-flag {
  position: relative;
  width: 58px;
  height: 38px;
  border-radius: 7px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

.syrian-flag > span:first-child {
  flex: 1;
  background: #000;
}

.syrian-flag > span:last-child {
  flex: 1;
  background: #fff;
}

.syrian-flag::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 50%;
  background: #ce1126;
  z-index: 0;
}

.syrian-flag .stars {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 0;
  width: 100%;
  height: 50%;
  transform: translateY(0);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: #fff;
  font-size: 9px;
  letter-spacing: 2px;
  white-space: nowrap;
  }
  </style>
</head>

<body>

  <div id="app">
<header class="app-header">

  <div class="brand">

    <div class="syrian-flag" aria-label="علم سوريا">
      <span></span>
      <span class="stars">★ ★ ★</span>
      <span></span>
    </div>

    <div class="brand-name">
      <div class="brand-ar">ليرتي</div>
      <div class="brand-en">Liraty</div>
    </div>

  </div>

  <div class="header-subtitle">
    أسعار العملات السورية
  </div>

</header>
  </div>

  <script>

    /* ========================================
       LIRATY
       JavaScript
       ======================================== */

  </script>

</body>
</html>
